<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Loom — pattern studio</title>
<style>
  :root { --bg:#0c0a12; --panel:#151021; --line:#2a2140; --ink:#efe9ff; --dim:#9a8fc0; --lime:#b892ff; --amber:#e3b341; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { padding:2.2rem 1.2rem 1rem; max-width:960px; margin:0 auto; }
  h1 { margin:0; font-size:1.7rem; letter-spacing:.06em; }
  h1 b { color:var(--lime); }
  main { max-width:960px; margin:0 auto; padding:0 1.2rem 3rem; display:grid; grid-template-columns:260px 1fr; gap:1.1rem; }
  @media (max-width:720px){ main { grid-template-columns:1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:1rem 1.1rem; }
  label { display:block; color:var(--dim); font-size:.78rem; margin:.7rem 0 .25rem; text-transform:uppercase; letter-spacing:.08em; }
  select, input, button { font:inherit; width:100%; }
  select, input { padding:.55rem .6rem; background:#0c0913; border:1px solid var(--line); border-radius:8px; color:var(--ink); }
  button { margin-top:.9rem; padding:.7rem 1rem; background:var(--lime); color:#160f28; border:0; border-radius:8px; font-weight:700; cursor:pointer; }
  button.ghost { background:transparent; color:var(--lime); border:1px solid var(--line); }
  .stage { display:grid; place-items:center; background:#0c0913; border:1px solid var(--line); border-radius:12px; min-height:360px; padding:1rem; }
  .stage svg { max-width:100%; height:auto; border-radius:8px; box-shadow:0 8px 30px #0008; }
  .row { display:flex; gap:.6rem; flex-wrap:wrap; }
  .pill { border:1px solid var(--line); border-radius:999px; padding:.1rem .55rem; color:var(--dim); font-size:.75rem; }
  .premium { color:var(--amber); }
  .muted { color:var(--dim); font-size:.85rem; }
  #log { margin-top:.6rem; color:var(--dim); font-size:.82rem; white-space:pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>🧵 <b>LOOM</b> <span class="muted">· generative pattern studio</span></h1>
  <p class="muted">Deterministic SVG patterns you can actually ship — pick a style, a palette, a seed. Free for personal use; Studio unlocks every style, every palette and a commercial licence.</p>
</header>
<main>
  <div class="card">
    <label for="style">Style</label>
    <select id="style"></select>
    <label for="palette">Palette</label>
    <select id="palette"></select>
    <label for="seed">Seed</label>
    <input id="seed" type="number" value="42" />
    <label for="size">Size (px)</label>
    <input id="size" type="number" value="800" min="256" max="2048" step="16" />
    <button id="go">Weave pattern</button>
    <button class="ghost" id="status">Studio status</button>
    <div id="log"></div>
  </div>

  <div>
    <div class="stage" id="stage"><span class="muted">your pattern appears here</span></div>
    <div class="card" style="margin-top:1.1rem">
      <div class="row" style="align-items:center">
        <span class="pill" id="license">personal</span>
        <button class="ghost" id="download" style="width:auto;margin:0" disabled>Download SVG</button>
        <button class="ghost" id="commercial" style="width:auto;margin:0">Get commercial licence</button>
      </div>
    </div>
  </div>
</main>
<script>
  const $ = (s) => document.querySelector(s);
  const api = (p) => 'api/' + p;
  let current = null;

  async function loadOptions() {
    const [s, p] = await Promise.all([
      fetch(api('styles')).then(r => r.json()),
      fetch(api('palettes')).then(r => r.json()),
    ]);
    $('#style').innerHTML = s.styles.map(x => `<option value="${x.id}">${x.name}${x.free ? '' : ' · studio'}</option>`).join('');
    $('#palette').innerHTML = p.palettes.map(x => `<option value="${x.name}">${x.name}${x.premium ? ' · studio' : ''}</option>`).join('');
  }

  $('#go').onclick = async () => {
    $('#log').textContent = 'weaving…';
    const r = await fetch(api('generate'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ style: $('#style').value, palette: $('#palette').value, seed: Number($('#seed').value), size: Number($('#size').value) }),
    });
    const json = await r.json();
    if (r.status >= 400) { $('#log').textContent = '⚠ ' + (json.error || r.status) + (json.upgrade ? ' — ' + json.upgrade : ''); return; }
    current = json;
    $('#stage').innerHTML = json.svg;
    $('#license').textContent = json.license;
    $('#license').className = 'pill ' + (json.license === 'commercial' ? 'premium' : '');
    $('#download').disabled = false;
    $('#log').textContent = `#${json.id} · ${json.style} · ${json.palette} · seed ${json.seed}${json.watermark ? ' · watermarked' : ''}`;
  };

  $('#download').onclick = () => {
    if (!current) return;
    const blob = new Blob([current.svg], { type: 'image/svg+xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `loom-${current.id}-${current.style}.svg`;
    a.click();
    URL.revokeObjectURL(a.href);
  };

  $('#status').onclick = async () => {
    const j = await fetch(api('premium/status')).then(r => r.json());
    $('#log').textContent = `tier: ${j.tier} · $${j.price}/mo — ${j.message}`;
  };

  $('#commercial').onclick = async () => {
    const r = await fetch(api('premium/subscribe'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    const j = await r.json();
    $('#log').textContent = j.message + ' · ' + JSON.stringify(j.payment);
  };

  loadOptions();
</script>
</body>
</html>
