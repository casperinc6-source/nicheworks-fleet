<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Casper Inc. — Book your next trip</title>
<style>
  :root { --ink:#2b2620; --paper:#f4efe6; --card:#fffdf8; --accent:#b3541e; --accent-dark:#8a3f16; --ok:#2e7d32; --line:#e4dcc9; }
  * { box-sizing:border-box; }
  body { font-family:system-ui,-apple-system,sans-serif; margin:0; background:var(--paper); color:var(--ink); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:1rem 1.5rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.5rem; }
  header h1 { margin:0; font-size:1.25rem; letter-spacing:.5px; }
  header h1 span { color:var(--accent); }
  nav button { background:none; border:1px solid var(--line); border-radius:8px; padding:.45rem .9rem; cursor:pointer; font-size:.95rem; }
  nav button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { max-width:900px; margin:1.5rem auto; padding:0 1rem; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:1rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1.1rem; display:flex; flex-direction:column; gap:.4rem; }
  .card h3 { margin:0; }
  .card .country { color:#7a6f5d; font-size:.85rem; }
  .card .blurb { font-size:.9rem; flex:1; }
  .price { font-weight:700; color:var(--accent-dark); }
  .seats { font-size:.8rem; color:#7a6f5d; }
  .seats.low { color:#c0392b; font-weight:600; }
  .card button, form button { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:.55rem 1rem; cursor:pointer; font-size:.95rem; }
  .card button:disabled { background:#c9bfa8; cursor:not-allowed; }
  .card button:not(:disabled):hover { background:var(--accent-dark); }
  form { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1.2rem; display:grid; gap:.8rem; max-width:420px; margin:1rem auto; }
  form h3 { margin:0 0 .3rem; }
  label { font-size:.85rem; display:grid; gap:.25rem; }
  input, select { padding:.55rem; border:1px solid var(--line); border-radius:8px; font-size:1rem; background:#fff; }
  form button { justify-self:start; }
  .msg { padding:.6rem .9rem; border-radius:8px; font-size:.9rem; }
  .msg.ok { background:#e5f3e6; color:var(--ok); }
  .msg.err { background:#f9e4e1; color:#a93226; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th,td { padding:.6rem .8rem; text-align:left; font-size:.9rem; border-bottom:1px solid var(--line); }
  th { background:#efe8d8; }
  td button { background:#a93226; border:none; color:#fff; border-radius:6px; padding:.3rem .7rem; cursor:pointer; }
  .empty { color:#7a6f5d; text-align:center; padding:2rem; }
  footer { text-align:center; color:#7a6f5d; font-size:.8rem; padding:2rem 0 1.5rem; }
</style>
</head>
<body>
<header>
  <h1>🧳 CASPER <span>INC.</span></h1>
  <nav>
    <button data-view="trips" class="active">Trips</button>
    <button data-view="manage">My bookings</button>
  </nav>
</header>

<main>
  <div class="msg" id="stripe-banner" hidden></div>
  <section id="view-trips">
    <div class="cards" id="trip-cards"></div>
    <form id="book-form" hidden>
      <h3 id="form-title">Book trip</h3>
      <input type="hidden" id="trip-id" />
      <label>Guest name<input id="guest" required minlength="2" placeholder="Jane Traveler" /></label>
      <label>Email<input id="email" type="email" required placeholder="jane@example.com" /></label>
      <label>Seats<select id="seats"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
      <div class="msg" id="form-msg" hidden></div>
      <button type="submit" id="pay-btn">Confirm &amp; pay</button>
    </form>
  </section>

  <section id="view-manage" hidden>
    <form id="lookup" style="max-width:420px;margin:0 auto 1rem;display:grid;gap:.6rem;">
      <label>Find bookings by email<input id="lookup-email" type="email" required placeholder="jane@example.com" /></label>
      <button type="submit">Search</button>
    </form>
    <div id="bookings-result"></div>
  </section>
</main>

<footer>Casper Inc. — company travel, made easy. Payments secured by Stripe.</footer>

<script>
const $ = (s) => document.querySelector(s);
const money = (n) => '$' + n.toLocaleString('en-US');
let TRIPS = [];

document.querySelectorAll('nav button').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    $('#view-trips').hidden = btn.dataset.view !== 'trips';
    $('#view-manage').hidden = btn.dataset.view !== 'manage';
    if (btn.dataset.view === 'trips') { $('#book-form').hidden = true; loadTrips(); }
  });
});

async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

async function loadTrips() {
  // Relative URLs keep the page working at / and behind fuse-hub's /casper/.
  TRIPS = await api('api/trips');
  $('#trip-cards').innerHTML = TRIPS.map((t) => `
    <div class="card">
      <h3>${t.name}</h3>
      <div class="country">${t.country} · ${t.code}</div>
      <div class="blurb">${t.blurb}</div>
      <div><span class="price">${money(t.price)}</span> <span class="seats ${t.seats <= 3 ? 'low' : ''}">· ${t.seats} seats left</span></div>
      <button data-book="${t.id}" ${t.seats === 0 ? 'disabled' : ''}>${t.seats === 0 ? 'Sold out' : 'Book'}</button>
    </div>`).join('');
  document.querySelectorAll('[data-book]').forEach((b) =>
    b.addEventListener('click', () => openForm(Number(b.dataset.book))));
}

function openForm(tripId) {
  const t = TRIPS.find((x) => x.id === tripId);
  $('#form-title').textContent = `Book: ${t.name} — ${money(t.price)} per seat`;
  $('#trip-id').value = tripId;
  $('#form-msg').hidden = true;
  $('#book-form').hidden = false;
  $('#book-form').scrollIntoView({ behavior: 'smooth' });
}

function showMsg(el, ok, text) {
  el.className = 'msg ' + (ok ? 'ok' : 'err');
  el.textContent = text;
  el.hidden = false;
}

$('#book-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = $('#form-msg');
  const btn = $('#pay-btn');
  try {
    btn.disabled = true;
    // Server creates a REAL Stripe Checkout Session and returns its URL.
    const { checkoutUrl } = await api('api/bookings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        tripId: Number($('#trip-id').value),
        guest: $('#guest').value,
        email: $('#email').value,
        seats: Number($('#seats').value),
      }),
    });
    if (checkoutUrl) {
      showMsg(msg, true, '🔐 Redirecting to Stripe secure checkout…');
      window.location.assign(checkoutUrl); // real Stripe-hosted payment page
      return;
    }
    showMsg(msg, false, '⚠️ No checkout URL returned');
  } catch (err) {
    showMsg(msg, false, '⚠️ ' + err.message);
  } finally {
    btn.disabled = false;
  }
});

// Returning from Stripe: ?payment=success|cancelled (&session_id=…)
(async function handleStripeReturn() {
  const q = new URLSearchParams(window.location.search);
  const payment = q.get('payment');
  if (!payment) return;
  const banner = $('#stripe-banner');
  banner.hidden = false;
  if (payment === 'success' && q.get('session_id')) {
    try {
      const r = await api('api/checkout/return?session_id=' + encodeURIComponent(q.get('session_id')));
      if (r.status === 'confirmed') {
        banner.className = 'msg ok';
        banner.textContent = `✅ Payment received! Booking #${r.booking.id} — ${r.booking.trip}, ${r.booking.seats} seat(s), ${money(r.booking.total)}. Confirmation sent to ${r.booking.email}.`;
      } else {
        banner.className = 'msg err';
        banner.textContent = '⏳ Payment not completed yet — refresh in a moment.';
      }
    } catch (e) {
      banner.className = 'msg err';
      banner.textContent = '⚠️ Could not verify payment: ' + e.message;
    }
  } else {
    banner.className = 'msg err';
    banner.textContent = '❌ Payment cancelled — your held seats have been released.';
  }
  window.history.replaceState({}, '', '/'); // clean the URL
})();

$('#lookup').addEventListener('submit', async (e) => {
  e.preventDefault();
  const box = $('#bookings-result');
  const list = await api('api/bookings?email=' + encodeURIComponent($('#lookup-email').value));
  if (!list.length) { box.innerHTML = '<div class="empty">No bookings found for that email.</div>'; return; }
  box.innerHTML = `<table><tr><th>#</th><th>Trip</th><th>Guest</th><th>Seats</th><th>Total</th><th></th></tr>
    ${list.map((b) => `<tr><td>${b.id}</td><td>${b.trip}</td><td>${b.guest}</td><td>${b.seats}</td><td>${money(b.total)}</td>
      <td><button data-cancel="${b.id}">Cancel</button></td></tr>`).join('')}</table>`;
  box.querySelectorAll('[data-cancel]').forEach((btn) =>
    btn.addEventListener('click', async () => {
      await api('api/bookings/' + btn.dataset.cancel, { method: 'DELETE' });
      $('#lookup').dispatchEvent(new Event('submit'));
    }));
});

loadTrips();
</script>
</body>
</html>
