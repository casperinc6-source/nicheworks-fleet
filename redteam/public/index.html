<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>redteam — fleet hardening console</title>
<style>
  :root { --bg:#101418; --card:#181f26; --ink:#e8edf2; --mut:#8b98a5; --ok:#2ecc71; --bad:#e74c3c; --warn:#f0b429; --line:#26303a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:1.1rem 1.5rem; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:1rem; flex-wrap:wrap; }
  header h1 { margin:0; font-size:1.2rem; }
  header h1 span { color:var(--bad); }
  .chip { font-size:.78rem; color:var(--mut); border:1px solid var(--line); border-radius:999px; padding:.25rem .6rem; }
  .chip.ok { color:var(--ok); border-color:#1f4d33; }
  .chip.bad { color:var(--bad); border-color:#5a2320; }
  main { max-width:1000px; margin:1.4rem auto 3rem; padding:0 1rem; display:grid; gap:1.1rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1rem 1.1rem; }
  .row { display:flex; gap:.6rem; flex-wrap:wrap; align-items:end; }
  label { font-size:.75rem; color:var(--mut); display:grid; gap:.25rem; }
  select, input, button { background:#0d1114; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:.5rem; font-size:.9rem; font-family:inherit; }
  button { background:var(--bad); border:none; color:#26090a; font-weight:700; cursor:pointer; padding:.55rem .9rem; }
  button.ghost { background:none; border:1px solid var(--line); color:var(--mut); font-weight:400; }
  button:disabled { opacity:.5; cursor:default; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:.7rem; }
  .stat { background:#0d1114; border:1px solid var(--line); border-radius:10px; padding:.6rem .75rem; }
  .stat .k { color:var(--mut); font-size:.7rem; text-transform:uppercase; letter-spacing:.4px; }
  .stat .v { font-size:1.35rem; font-weight:700; margin-top:.15rem; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:.5rem .6rem; border-bottom:1px solid var(--line); font-size:.86rem; vertical-align:top; }
  th { color:var(--mut); font-size:.7rem; text-transform:uppercase; letter-spacing:.4px; }
  code { background:#0d1114; border-radius:5px; padding:.1rem .35rem; font-size:.82rem; }
  .pass { color:var(--ok); } .fail { color:var(--bad); }
  .reason { color:var(--mut); font-size:.8rem; }
  .muted { color:var(--mut); font-size:.85rem; }
  pre { background:#0d1114; border:1px solid var(--line); border-radius:10px; padding:.7rem; overflow:auto; max-height:280px; font-size:.78rem; color:#c9d4de; }
  ul.runs { list-style:none; margin:0; padding:0; display:grid; gap:.35rem; }
  ul.runs li { display:flex; gap:.6rem; align-items:center; font-size:.85rem; }
  ul.runs button { font-size:.75rem; padding:.3rem .55rem; }
  details summary { cursor:pointer; color:var(--mut); font-size:.85rem; }
  .probes { display:grid; gap:.25rem; max-height:200px; overflow:auto; }
  .probe { display:flex; gap:.5rem; font-size:.8rem; color:var(--mut); }
  .probe b { color:var(--ink); font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>red<span>team</span> — fleet hardening console</h1>
  <span class="chip" id="pf">checking promptfoo…</span>
  <span class="chip" id="tcount">— targets</span>
</header>

<main>
  <section class="card">
    <div class="row">
      <label>Target<select id="target"></select></label>
      <label>API path (optional)<input id="apiPath" placeholder="/api/entries" /></label>
      <label>Ad-hoc URL<input id="custom" placeholder="http://127.0.0.1:3999" size="24" /></label>
      <button id="run">Run scan</button>
      <button class="ghost" id="refresh">Refresh</button>
    </div>
    <p class="muted" style="margin:.8rem 0 0" id="suiteInfo">Loading suite…</p>
    <div class="probes" id="probes"></div>
  </section>

  <section class="card" id="resultCard" hidden>
    <div class="row" style="justify-content:space-between">
      <strong id="runTitle">—</strong>
      <span class="chip" id="runStatus">—</span>
    </div>
    <div class="stats" style="margin-top:.8rem">
      <div class="stat"><div class="k">Probes</div><div class="v" id="s-probes">—</div></div>
      <div class="stat"><div class="k">Checks passed</div><div class="v pass" id="s-pass">—</div></div>
      <div class="stat"><div class="k">Checks failed</div><div class="v fail" id="s-fail">—</div></div>
      <div class="stat"><div class="k">Errored</div><div class="v" id="s-err">—</div></div>
    </div>
    <table style="margin-top:.9rem">
      <thead><tr><th>Probe</th><th>Request</th><th>HTTP</th><th>Verdict</th><th>Checks</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <details style="margin-top:.8rem"><summary>promptfoo output</summary><pre id="log">—</pre></details>
  </section>

  <section class="card">
    <strong>Run history</strong>
    <ul class="runs" id="runs" style="margin-top:.6rem"><li class="muted">none yet</li></ul>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Relative URLs: the console works both on :3009 and behind fuse-hub's /redteam/.
const api = async (path, options) => {
  const res = await fetch(path, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
};
let poll = null;

async function loadStatus() {
  const s = await api('api/status?probe=1');
  const pf = s.promptfoo;
  $('#pf').textContent = pf.available ? `promptfoo ${pf.version} · ${pf.how}` : 'promptfoo missing';
  $('#pf').className = 'chip ' + (pf.available ? 'ok' : 'bad');
  $('#tcount').textContent = `${s.targets} targets`;
}

async function loadTargets() {
  const { targets } = await api('api/targets');
  $('#target').innerHTML = targets.map((t) =>
    `<option value="${esc(t.mount)}">${t.health && t.health.up ? '🟢' : '⚪'} ${esc(t.name)} — ${esc(t.base)}${t.apiPath ? ' ' + esc(t.apiPath) : ''}</option>`
  ).join('');
}

async function loadSuite() {
  const key = customTarget() || $('#target').value;
  const data = await api('api/suite?target=' + encodeURIComponent(key));
  $('#suiteInfo').textContent = `${data.probes.length} probes against ${data.target.name} (${data.target.base}${data.target.apiPath ? ' + ' + data.target.apiPath : ''})`;
  $('#probes').innerHTML = data.probes.map((p) =>
    `<div class="probe"><b>${esc(p.id)}</b><code>${esc(p.method)} ${esc(p.path)}</code><span>${esc(p.what)}</span></div>`
  ).join('');
}

function customTarget() {
  const value = $('#custom').value.trim();
  return value || null;
}

function renderRun(run) {
  $('#resultCard').hidden = false;
  $('#runTitle').textContent = `${run.label} · ${run.targetName || run.target}`;
  $('#runStatus').textContent = run.status + (run.finishedAt ? ` · exit ${run.exitCode}` : '');
  $('#runStatus').className = 'chip ' + (run.status === 'running' ? '' : run.status === 'done' ? 'ok' : 'bad');
  const s = run.summary;
  $('#s-probes').textContent = s ? s.probes : '—';
  $('#s-pass').textContent = s ? s.passed : '—';
  $('#s-fail').textContent = s ? s.failed : '—';
  $('#s-err').textContent = s ? s.errored : '—';
  $('#log').textContent = run.log ? run.log.slice(-8000) : '(no output yet)';
  $('#rows').innerHTML = (run.rows || []).map((row) => `
    <tr>
      <td><b>${esc(row.probe)}</b><div class="reason">${esc(row.what)}</div></td>
      <td><code>${esc(row.method)} ${esc(row.path)}</code></td>
      <td>${row.status == null ? 'dropped' : row.status}</td>
      <td class="${row.passed ? 'pass' : 'fail'}">${row.passed ? 'PASS' : 'FAIL'}${row.errored ? ' (error)' : ''}</td>
      <td>${row.checks.map((c) => `<div class="${c.passed ? 'pass' : 'fail'}">${c.passed ? '✓' : '✗'} ${esc(c.check)}</div><div class="reason">${esc(c.reason)}</div>`).join('')}</td>
    </tr>`).join('') || '<tr><td colspan="5" class="muted">no results yet</td></tr>';
}

async function loadRuns() {
  const { runs, activeRun } = await api('api/runs');
  $('#runs').innerHTML = runs.length ? runs.map((r) => `
    <li><span class="chip">${esc(r.status)}</span>
      <a href="#" data-run="${esc(r.id)}">${esc(r.label)}</a>
      <span class="muted">${esc(r.startedAt)}${r.summary ? ` · ${r.summary.passed}/${r.summary.checks} checks passed` : ''}</span></li>`).join('')
    : '<li class="muted">none yet</li>';
  $('#runs').querySelectorAll('a[data-run]').forEach((a) => a.addEventListener('click', async (e) => {
    e.preventDefault();
    renderRun(await api('api/runs/' + a.dataset.run));
  }));
  return activeRun;
}

async function watch(id) {
  clearInterval(poll);
  poll = setInterval(async () => {
    const run = await api('api/runs/' + id);
    renderRun(run);
    if (run.status !== 'running') { clearInterval(poll); loadRuns(); }
  }, 1500);
}

$('#run').addEventListener('click', async () => {
  const body = { target: customTarget() || $('#target').value };
  const apiPath = $('#apiPath').value.trim();
  if (apiPath) body.apiPath = apiPath;
  $('#run').disabled = true;
  $('#resultCard').hidden = false;
  try {
    const { run } = await api('api/scan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    renderRun(run);
    watch(run.id);
  } catch (error) {
    alert(error.message);
  } finally {
    $('#run').disabled = false;
  }
});

$('#refresh').addEventListener('click', () => { loadTargets(); loadSuite(); loadStatus(); });
$('#custom').addEventListener('change', loadSuite);
$('#target').addEventListener('change', () => { $('#custom').value = ''; loadSuite(); });
$('#apiPath').addEventListener('change', loadSuite);

(async () => {
  try {
    await Promise.all([loadStatus(), loadTargets()]);
    await loadSuite();
    const active = await loadRuns();
    if (active) { renderRun(await api('api/runs/' + active)); watch(active); }
  } catch (error) {
    $('#suiteInfo').textContent = error.message;
  }
})();
</script>
</body>
</html>
