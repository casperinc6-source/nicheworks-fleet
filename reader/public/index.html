<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reader — private reader</title>
<style>
  :root { --bg:#0f0d0a; --panel:#181510; --line:#2b2419; --ink:#f4ece0; --dim:#9c8f7d; --paper:#e9b872; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.7 system-ui, sans-serif; }
  header { padding:2.2rem 1.2rem 1rem; max-width:820px; margin:0 auto; }
  h1 { margin:0; font-size:1.7rem; } h1 b { color:var(--paper); font-family:ui-monospace, monospace; }
  main { max-width:820px; margin:0 auto; padding:0 1.2rem 3rem; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:1rem 1.1rem; margin-top:1.1rem; }
  input, button { font:inherit; } input[type=url] { width:100%; padding:.7rem .8rem; background:#0c0a07; border:1px solid var(--line); border-radius:8px; color:var(--ink); }
  button { margin-top:.7rem; padding:.65rem 1rem; background:var(--paper); color:#25190a; border:0; border-radius:8px; font-weight:700; cursor:pointer; }
  button.ghost { background:transparent; color:var(--paper); border:1px solid var(--line); }
  .row { display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; }
  article { background:#f7f1e6; color:#241c12; border-radius:12px; padding:1.4rem 1.6rem; margin-top:1.1rem; white-space:pre-wrap; }
  article h2 { margin-top:0; }
  .muted { color:var(--dim); font-size:.85rem; font-family:ui-monospace, monospace; }
  label { display:flex; gap:.4rem; align-items:center; color:var(--dim); font-size:.85rem; margin-top:.5rem; }
</style>
</head>
<body>
<header>
  <h1>📖 <b>READER</b> <span class="muted">· private reader</span></h1>
  <p class="muted">Paste a URL. Reader fetches it server-side, strips every script, style and tracker, and returns just the text — nothing from the page runs in your browser. Reader tier archives articles to your Vault.</p>
</header>
<main>
  <div class="card">
    <input type="url" id="url" placeholder="https://example.com/article" />
    <label><input type="checkbox" id="save" /> archive to Vault (Reader tier)</label>
    <div class="row">
      <button id="read">Read it</button>
      <button class="ghost" id="status">Reader status</button>
    </div>
    <div class="muted" id="log"></div>
  </div>
  <article id="out" hidden></article>
</main>
<script>
  const $ = (s) => document.querySelector(s);
  const api = (p) => 'api/' + p;

  $('#read').onclick = async () => {
    const url = $('#url').value.trim();
    if (!url) return;
    $('#log').textContent = 'fetching and stripping scripts…';
    const r = await fetch(api('read'), { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ url, save: $('#save').checked }) });
    const j = await r.json();
    if (r.status >= 400) { $('#log').textContent = '⚠ ' + (j.error || r.status) + (j.upgrade ? ' — ' + j.upgrade : ''); return; }
    $('#log').textContent = `#${j.id} · ${j.words} words${j.saved ? ' · archived to Vault' : ''}`;
    $('#out').hidden = false;
    $('#out').innerHTML = `<h2>${(j.title || '').replace(/[<>&]/g, ' ')}</h2>` + (j.text || '').replace(/[<>&]/g, ' ');
  };

  $('#status').onclick = async () => {
    const j = await fetch(api('premium/status')).then(r => r.json());
    $('#log').textContent = `tier: ${j.tier} · $${j.price}/mo · free ${j.freeDailyReads}/day — ${j.message}`;
  };
</script>
</body>
</html>
