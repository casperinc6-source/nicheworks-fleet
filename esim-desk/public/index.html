<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>eSIM Desk — travel data</title>
<style>
  :root { --bg:#070c14; --panel:#0f1725; --line:#1e2b40; --ink:#e9f1ff; --dim:#8093b0; --blue:#5aa9ff; --amber:#e3b341; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { padding:2.2rem 1.2rem 1rem; max-width:920px; margin:0 auto; }
  h1 { margin:0; font-size:1.7rem; letter-spacing:.06em; } h1 b { color:var(--blue); }
  main { max-width:920px; margin:0 auto; padding:0 1.2rem 3rem; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:1rem 1.1rem; margin-top:1.1rem; }
  input, button { font:inherit; } input { flex:1; padding:.6rem .7rem; background:#080f1a; border:1px solid var(--line); border-radius:8px; color:var(--ink); }
  button { padding:.6rem .95rem; background:var(--blue); color:#04121f; border:0; border-radius:8px; font-weight:700; cursor:pointer; }
  button.ghost { background:transparent; color:var(--blue); border:1px solid var(--line); }
  .row { display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:.8rem; margin-top:.8rem; }
  .plan { background:#0b1320; border:1px solid var(--line); border-radius:10px; padding:.8rem .9rem; }
  .plan h3 { margin:0 0 .3rem; font-size:.95rem; }
  .price { color:var(--blue); font-weight:800; font-size:1.15rem; }
  .muted { color:var(--dim); font-size:.82rem; }
  code { background:#080f1a; padding:.05rem .35rem; border-radius:4px; }
</style>
</head>
<body>
<header>
  <h1>📶 eSIM <b>DESK</b> <span class="muted">· travel data</span></h1>
  <p class="muted">Travel data plans by region. This is an honest referral storefront: pick a plan and we hand you the provider checkout. Nomad tier adds itinerary-to-plan matching and order history.</p>
</header>
<main>
  <div class="card">
    <div class="row">
      <input id="q" placeholder="search country or region (e.g. Japan, Europe)…" />
      <button id="go">Search</button>
      <button class="ghost" id="all">All plans</button>
      <button class="ghost" id="nomad">Nomad ($9/mo)</button>
    </div>
    <div class="muted" id="log"></div>
  </div>
  <div class="grid" id="plans"></div>

  <div class="card" id="checkout" hidden></div>
</main>
<script>
  const $ = (s) => document.querySelector(s);
  const api = (p) => 'api/' + p;

  function render(plans) {
    $('#plans').innerHTML = plans.map(p => `<div class="plan">
      <h3>${p.name}</h3>
      <div class="price">$${p.price}</div>
      <div class="muted">${p.region} · ${p.data} · ${p.days} days</div>
      <div class="muted">${p.countries.slice(0,3).join(', ')}${p.countries.length>3?'…':''}</div>
      <button data-buy="${p.id}" style="margin-top:.6rem;width:100%">Checkout</button>
    </div>`).join('');
  }

  async function load(q) {
    const url = q ? api('search') + '?q=' + encodeURIComponent(q) : api('plans');
    const j = await fetch(url).then(r => r.json());
    render(j.plans || []);
    $('#log').textContent = (j.plans || []).length + ' plans';
  }

  document.addEventListener('click', async (e) => {
    const id = e.target.getAttribute && e.target.getAttribute('data-buy');
    if (!id) return;
    const r = await fetch(api('checkout'), { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ planId: id }) });
    const j = await r.json();
    $('#checkout').hidden = false;
    $('#checkout').innerHTML = `<b>${j.plan.name}</b> — $${j.plan.price}
      <div class="muted">channel: ${j.channel}</div>
      <div class="muted">${j.note || ''}</div>
      <div style="margin-top:.5rem">outbound: <a href="${j.checkoutUrl || '#'}" target="_blank" rel="noopener">${j.checkoutUrl || 'n/a'}</a></div>
      <div class="muted" style="margin-top:.4rem">${j.concierge || ''}</div>`;
  });

  $('#go').onclick = () => load($('#q').value.trim());
  $('#all').onclick = () => load('');
  $('#nomad').onclick = async () => {
    const j = await fetch(api('premium/subscribe'), { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' }).then(r => r.json());
    $('#log').textContent = j.message + ' · ' + JSON.stringify(j.payment);
  };
  load('');
</script>
</body>
</html>
