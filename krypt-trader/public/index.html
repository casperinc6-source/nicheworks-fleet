<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Krypt Trader — live market</title>
<style>
  :root { --bg:#08080b; --panel:#121216; --line:#242430; --ink:#f0f0f5; --dim:#8a8a99; --green:#3ddc84; --red:#ff6b6b; --gold:#ffd479; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { padding:2.2rem 1.2rem 1rem; max-width:960px; margin:0 auto; }
  h1 { margin:0; font-size:1.7rem; letter-spacing:.06em; } h1 b { color:var(--gold); }
  main { max-width:960px; margin:0 auto; padding:0 1.2rem 3rem; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:1rem 1.1rem; margin-top:1.1rem; }
  table { width:100%; border-collapse:collapse; } td,th { text-align:left; padding:.4rem .5rem; border-bottom:1px solid var(--line); font-size:.88rem; }
  input, button, textarea { font:inherit; } input, textarea { padding:.55rem .6rem; background:#0b0b10; border:1px solid var(--line); border-radius:8px; color:var(--ink); }
  textarea { width:100%; min-height:70px; }
  button { padding:.6rem .95rem; background:var(--gold); color:#1a1200; border:0; border-radius:8px; font-weight:700; cursor:pointer; }
  button.ghost { background:transparent; color:var(--gold); border:1px solid var(--line); }
  .row { display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; }
  .up { color:var(--green); } .down { color:var(--red); }
  .muted { color:var(--dim); font-size:.82rem; }
  .readonly { border:1px dashed var(--line); padding:.4rem .6rem; border-radius:8px; color:var(--dim); font-size:.8rem; }
</style>
</head>
<body>
<header>
  <h1>📈 KRYPT <b>TRADER</b> <span class="muted">· live crypto market</span></h1>
  <p class="muted">Live prices and indicators from the public CoinGecko feed. Analyse, value a portfolio, read the SMA/RSI signal. <span class="readonly">read-only — this service never places orders</span></p>
</header>
<main>
  <div class="card">
    <div class="row"><button id="refresh">Load market</button><span class="muted" id="at"></span></div>
    <table><thead><tr><th>Symbol</th><th>Price (USD)</th><th>24h</th></tr></thead><tbody id="market"></tbody></table>
  </div>

  <div class="card">
    <b>Portfolio</b>
    <div class="muted">One holding per line: <code>SYMBOL amount unitCost</code></div>
    <textarea id="holdings">BTC 0.5 42000
ETH 4 2200
SOL 30 110</textarea>
    <div class="row"><button id="value">Value at live prices</button><button class="ghost" id="signal">Signal BTC</button><button class="ghost" id="trader">Trader ($19/mo)</button></div>
    <div id="out" class="muted" style="margin-top:.6rem"></div>
  </div>
</main>
<script>
  const $ = (s) => document.querySelector(s);
  const api = (p) => 'api/' + p;
  const money = (n) => n == null ? '—' : '$' + n.toLocaleString(undefined, { maximumFractionDigits: 2 });
  const pct = (n) => n == null ? '—' : `<span class="${n >= 0 ? 'up' : 'down'}">${n >= 0 ? '+' : ''}${n.toFixed(2)}%</span>`;

  async function market() {
    $('#market').innerHTML = `<tr><td colspan="3" class="muted">loading live prices…</td></tr>`;
    const j = await fetch(api('market')).then(r => r.json());
    if (!j.quotes) { $('#market').innerHTML = `<tr><td colspan="3" class="muted">feed error: ${j.error || 'unavailable'}</td></tr>`; return; }
    $('#at').textContent = 'at ' + j.at;
    $('#market').innerHTML = Object.entries(j.quotes).map(([s, q]) =>
      `<tr><td><b>${s}</b></td><td>${money(q.usd)}</td><td>${pct(q.change24h)}</td></tr>`).join('');
  }

  function parseHoldings() {
    return $('#holdings').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
      const [symbol, amount, cost] = l.split(/\s+/);
      return { symbol, amount: Number(amount), cost: Number(cost) };
    });
  }

  $('#value').onclick = async () => {
    $('#out').textContent = 'valuing…';
    const r = await fetch(api('portfolio'), { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ holdings: parseHoldings() }) });
    const j = await r.json();
    if (r.status >= 400) { $('#out').textContent = '⚠ ' + (j.error || r.status); return; }
    $('#out').innerHTML = `value <b>${money(j.value)}</b> · cost ${money(j.cost)} · P&L <span class="${j.pnl>=0?'up':'down'}">${money(j.pnl)} (${pct(j.pnlPct)})</span>` +
      `<table><tbody>${j.holdings.map(h => `<tr><td>${h.symbol}</td><td>${money(h.price)}</td><td>${money(h.value)}</td><td>${h.pnl==null?'—':(h.pnl>=0?'<span class="up">':'<span class="down">')+money(h.pnl)+'</span>'}</td></tr>`).join('')}</tbody></table>`;
  };

  $('#signal').onclick = async () => {
    $('#out').textContent = 'computing indicators…';
    const j = await fetch(api('candles') + '?symbol=BTC&days=90').then(r => r.json());
    if (j.error) { $('#out').textContent = '⚠ ' + j.error; return; }
    $('#out').innerHTML = `BTC $${j.last?.toLocaleString()} · ${j.days}d ${pct(j.changePct)}<br>SMA7 ${j.indicators.sma7?.toFixed(0)} · SMA30 ${j.indicators.sma30?.toFixed(0)} · RSI14 ${j.indicators.rsi14}<br><b>${j.indicators.signal}</b>${j.upgrade ? `<div class="muted">${j.upgrade}</div>` : ''}`;
  };

  $('#trader').onclick = async () => {
    const j = await fetch(api('premium/subscribe'), { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' }).then(r => r.json());
    $('#out').textContent = j.message + ' · ' + JSON.stringify(j.payment);
  };

  $('#refresh').onclick = market;
  market();
</script>
</body>
</html>
