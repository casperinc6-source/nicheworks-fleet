<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent-Zero — throne room</title>
<style>
  :root { --bg:#07090c; --panel:#0f141a; --line:#1e2732; --ink:#e9f1f7; --dim:#7d8b99; --gold:#ffd479; --lime:#7ee787; --red:#ff7b72; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { padding:2.4rem 1.2rem 1rem; max-width:920px; margin:0 auto; text-align:left; }
  h1 { margin:0; font-size:1.8rem; letter-spacing:.08em; } h1 b { color:var(--gold); }
  main { max-width:920px; margin:0 auto; padding:0 1.2rem 3rem; }
  .crown { font-size:2.6rem; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:1.1rem 1.2rem; margin-top:1.1rem; }
  .index { font-size:3rem; font-weight:800; color:var(--gold); }
  .row { display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; }
  table { width:100%; border-collapse:collapse; } td,th { text-align:left; padding:.35rem .5rem; border-bottom:1px solid var(--line); font-size:.86rem; }
  .up { color:var(--lime); } .down { color:var(--red); }
  input, button { font:inherit; } input { flex:1; padding:.65rem .8rem; background:#080c10; border:1px solid var(--line); border-radius:8px; color:var(--ink); }
  button { padding:.65rem .95rem; background:var(--gold); color:#1a1200; border:0; border-radius:8px; font-weight:700; cursor:pointer; }
  button.ghost { background:transparent; color:var(--gold); border:1px solid var(--line); }
  .pill { border:1px solid var(--line); border-radius:999px; padding:.12rem .6rem; color:var(--dim); font-size:.78rem; }
  #reply { margin-top:.7rem; white-space:pre-wrap; }
  .muted { color:var(--dim); font-size:.85rem; }
</style>
</head>
<body>
<header>
  <h1><span class="crown">👑</span> AGENT<b>-ZERO</b> <span class="muted">· the king of the fleet</span></h1>
  <p class="muted">Every throne in one court. Agent-Zero probes every app for real, keeps a live kingdom index, and takes orders — including dispatching Watchtower to audit any target.</p>
</header>
<main>
  <div class="card row" style="justify-content:space-between">
    <div><div class="index" id="idx">–</div><div class="muted" id="idxsub">measuring the realm…</div></div>
    <div class="muted" id="mrr"></div>
  </div>

  <div class="card">
    <table><thead><tr><th>Throne</th><th>Role</th><th>State</th><th>Latency</th><th>Worth/mo</th></tr></thead><tbody id="fleet"></tbody></table>
    <div class="row" style="margin-top:.7rem"><button class="ghost" id="refresh">Re-survey the realm</button></div>
  </div>

  <div class="card">
    <div class="row"><input id="cmd" placeholder='try: "status", "audit example.com", "crown"' /><button id="send">Decree</button></div>
    <div id="reply" class="muted"></div>
    <div class="row" style="margin-top:.5rem"><button class="ghost" id="throne">Claim the throne ($499/mo)</button><span class="pill" id="tier">free</span></div>
  </div>
</main>
<script>
  const $ = (s) => document.querySelector(s);
  const api = (p) => 'api/' + p;

  async function survey() {
    const j = await fetch(api('state')).then(r => r.json());
    $('#idx').textContent = j.index;
    $('#idxsub').textContent = `${j.up}/${j.total} apps standing · coverage ${j.coverage}% · avg ${j.avgLatency ?? '—'}ms`;
    $('#mrr').innerHTML = `combined potential<br><b style="color:var(--gold)">$${j.mrrPotential.toFixed(2)}</b>/mo`;
    $('#fleet').innerHTML = j.fleet.map(m => `
      <tr><td>${m.name}</td><td class="muted">${m.role}</td>
      <td class="${m.up ? 'up' : 'down'}">${m.up ? '● up' : '○ down'}</td>
      <td class="muted">${m.up ? m.ms + 'ms' : '—'}</td>
      <td class="muted">${m.price == null ? '—' : '$' + m.price}</td></tr>`).join('');
  }

  async function decree(text) {
    $('#reply').textContent = '…';
    const r = await fetch(api('directive'), { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ text }) });
    const j = await r.json();
    $('#reply').textContent = '👑 ' + j.reply;
    if (j.intent === 'status' || j.intent === 'crown') survey();
  }

  $('#send').onclick = () => { const t = $('#cmd').value.trim(); if (t) decree(t); };
  $('#cmd').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#send').click(); });
  $('#refresh').onclick = survey;
  $('#throne').onclick = async () => {
    const r = await fetch(api('premium/subscribe'), { method:'POST', headers:{'Content-Type':'application/json'}, body: '{}' });
    const j = await r.json();
    $('#tier').textContent = j.tier; $('#reply').textContent = j.message + ' · ' + JSON.stringify(j.payment);
  };

  survey();
</script>
</body>
</html>
